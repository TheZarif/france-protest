[project]
name = "tenebres"
version = "0.1.0"
description = "Tracing how the slogan 'Bismillah c'est les ténèbres' spread across news and social media during the 2026 French protests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "requests>=2.32",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "trafilatura>=1.12",
    "googlenewsdecoder>=0.1.7",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Heavier ML models for sentiment, toxicity and topic modelling.
# Install with: uv sync --extra nlp
nlp = [
    "torch>=2.3",
    "transformers>=4.44",
    "sentencepiece>=0.2",
    "sentence-transformers>=3.0",
    "bertopic>=0.16",
]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[project.scripts]
tenebres = "tenebres.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenebres"]
